<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenBSD man pages — graph view</title>
<meta name="description" content="All OpenBSD manual pages as an interactive graph, connected by their SEE ALSO sections. Click a page to read it on man.openbsd.org.">
<style>
  :root {
    --bg: #0a0d13;
    --panel: rgba(13, 18, 27, 0.92);
    --border: #1d2635;
    --text: #d7dde8;
    --dim: #8b95a7;
    --accent: #f2a83b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #graph { position: fixed; inset: 0; }

  #panel {
    position: fixed; top: 16px; left: 16px; width: 320px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px); overflow: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; backdrop-filter: blur(8px);
  }
  #panel h1 { margin: 0; font-size: 17px; letter-spacing: 0.2px; }
  #panel h1 .puffy { color: var(--accent); }
  #panel .sub { color: var(--dim); font-size: 12px; margin: 3px 0 12px; }
  #panel .sub a { color: var(--dim); }

  #searchwrap { position: relative; margin-bottom: 12px; }
  #q {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--text);
    background: #0d1320; border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #results {
    position: absolute; z-index: 5; top: 100%; left: 0; right: 0; margin-top: 4px;
    background: #0d1320; border: 1px solid var(--border); border-radius: 8px;
    max-height: 320px; overflow: auto; display: none;
  }
  #results .hit { padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  #results .hit:hover, #results .hit.active { background: #16202f; }
  #results .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative; top: -1px; }
  #results .nm { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  #results .nm .sec { color: var(--dim); }
  #results .ds { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px 3px 7px; font-size: 12px;
    background: #0d1320;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip .cnt { color: var(--dim); font-size: 11px; }
  .chip.off { opacity: 0.38; }
  .chip.off .dot { background: #55607a !important; }

  #opts { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; font-size: 13px; color: var(--dim); }
  #opts label { display: flex; gap: 7px; align-items: center; cursor: pointer; }
  #opts input { accent-color: var(--accent); }

  #stats { font-size: 12.5px; color: var(--dim); border-top: 1px solid var(--border); padding-top: 10px; }
  #stats b { color: var(--text); font-weight: 600; }
  #hint { font-size: 11.5px; color: #6c7688; margin-top: 8px; }
  #credit { font-size: 11px; color: #59637a; margin-top: 6px; }
  #credit a { color: #59637a; }

  .graph-tooltip {
    background: rgba(13, 19, 28, 0.95) !important; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px !important; max-width: 340px;
    font: 12.5px/1.5 system-ui, sans-serif !important; color: var(--text) !important;
  }
  .graph-tooltip .tname { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .graph-tooltip .tsec { color: var(--dim); }
  .graph-tooltip .tdesc { color: var(--dim); margin-top: 2px; }
  .graph-tooltip .tmeta { color: #6c7688; margin-top: 4px; }

  #collapse {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; line-height: 22px;
    text-align: center; border: 1px solid var(--border); border-radius: 6px; background: #0d1320;
    color: var(--dim); cursor: pointer; user-select: none;
  }
  #panel.collapsed .body { display: none; }
  #panel.collapsed { width: auto; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 20; color: var(--dim); font-size: 15px;
    flex-direction: column; gap: 10px; transition: opacity .6s; pointer-events: none;
  }
  #loading .spin {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="graph"></div>

<aside id="panel">
  <div id="collapse" title="collapse panel">&#8722;</div>
  <h1>OpenBSD man pages</h1>
  <div class="sub">graph view &middot; connected by <b>SEE ALSO</b> &middot; <a href="https://man.openbsd.org" target="_blank" rel="noopener">man.openbsd.org</a></div>
  <div class="body">
    <div id="searchwrap">
      <input id="q" type="search" placeholder="Search man pages&hellip;  ( / )" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <div id="legend"></div>
    <div id="opts">
      <label><input type="checkbox" id="opt-orphans" checked> show unlinked pages</label>
    </div>
    <div id="stats"></div>
    <div id="hint">Drag to pan &middot; scroll to zoom &middot; hover to highlight &middot; click a node to open its manual page.</div>
    <div id="credit">data: OpenBSD-current man page sets &middot; <span id="gen"></span> &middot; <a href="https://github.com/realchonk/openbsd-man-graph" target="_blank" rel="noopener">source</a></div>
  </div>
</aside>

<div id="loading"><div class="spin"></div><div id="loadmsg">loading graph&hellip;</div></div>

<script src="force-graph.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
